<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- LCP Works favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="/LCP_logo_black.webp"
    />

    <!-- iPhone / iPad Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- iPhone / iPad Safari Safe Area -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- Website title -->
    <title>
      Build Your Garage From Nothing To Something | LCP.works
    </title>


    <!-- SEO Description -->
    <meta
      name="description"
      content="Build Your Garage From Nothing To Something. Premium custom Lego kits inspired by the world's most iconic muscle cars, sports racers, and off-road machines. Built for collectors."
    />


    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Build Your Garage From Nothing To Something"
    />

    <meta
      property="og:description"
      content="Premium custom Lego kits inspired by iconic vehicles. Monochrome aesthetics. Built for collectors."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://lcpworks.com"
    />

    <meta
      property="og:image"
      content="https://lcpworks.com/LCP_logo_black.webp"
    />


    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Build Your Garage From Nothing To Something"
    />

    <meta
      name="twitter:description"
      content="Premium custom Lego kits inspired by iconic vehicles. Built for collectors."
    />

    <meta
      name="twitter:image"
      content="https://lcpworks.com/LCP_logo_black.webp"
    />


    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

  </head>


  <body class="antialiased">

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>

</html>
